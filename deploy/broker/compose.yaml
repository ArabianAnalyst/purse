services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: purse
      POSTGRES_PASSWORD: purse
      POSTGRES_DB: purse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purse"]
      interval: 5s
      timeout: 3s
      retries: 10
  broker:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://purse:purse@postgres:5432/purse
      PURSE_ADMIN_TOKEN: ${PURSE_ADMIN_TOKEN:?set PURSE_ADMIN_TOKEN to a random string of at least 24 characters}
      PURSE_MAX_PER_ACTION: ${PURSE_MAX_PER_ACTION:-$$50}
      PURSE_MAX_PER_DAY: ${PURSE_MAX_PER_DAY:-$$500}
      PURSE_REQUIRE_APPROVAL_OVER: ${PURSE_REQUIRE_APPROVAL_OVER:-$$20}
      PURSE_ALLOW: ${PURSE_ALLOW:-api.stripe.com}
      PURSE_EXECUTOR: ${PURSE_EXECUTOR:-mock}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
  witness:
    build: .
    command: ["node", "dist/witness.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://purse:purse@postgres:5432/purse
      WITNESS_STREAM: ${PURSE_STREAM:-purse}
      WITNESS_KEY_FILE: /data/witness-key.pem
      REKOR_URL: ${REKOR_URL:-https://log2025-1.rekor.sigstore.dev}
      REKOR_LOG_KEY: ${REKOR_LOG_KEY:-}
      WITNESS_INTERVAL_MS: ${WITNESS_INTERVAL_MS:-300000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    volumes:
      - witness-data:/data
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${WITNESS_PORT:-8082}/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
  monitor:
    build: .
    command: ["node", "dist/monitor.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://purse:purse@postgres:5432/purse
      MONITOR_STREAM: ${PURSE_STREAM:-purse}
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-60000}
      MONITOR_WINDOW: ${MONITOR_WINDOW:-500/24h}
      MONITOR_VELOCITY: ${MONITOR_VELOCITY:-5/10m}
      DEADLATCH_URL: ${DEADLATCH_URL:-https://www.deadlatch.dev}
      DEADLATCH_PROJECT_KEY: ${DEADLATCH_PROJECT_KEY:-}
      MONITOR_FLAGS_FILE: /data/flags.jsonl
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    volumes:
      - monitor-data:/data
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${MONITOR_PORT:-8083}/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
volumes:
  witness-data: {}
  monitor-data: {}

app = "purse-broker"
primary_region = "lhr"

# One broker per PURSE_STREAM. A rolling deploy would run two on the same stream and the database would refuse the fork.
# One witness per stream for the same reason, on its own process group. The monitor is the third group, and one per stream too, since its cursor is keyed on the stream.
[deploy]
  strategy = "immediate"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "node dist/main.js"
  witness = "node dist/witness.js"
  monitor = "node dist/monitor.js"

[env]
  PURSE_AGENT_PORT = "8080"
  PURSE_ADMIN_PORT = "8081"
  PURSE_EXECUTOR = "mock"
  PURSE_MAX_PER_ACTION = "$50"
  PURSE_MAX_PER_DAY = "$500"
  PURSE_REQUIRE_APPROVAL_OVER = "$20"
  PURSE_ALLOW = "api.stripe.com"
  WITNESS_STREAM = "purse"
  WITNESS_PORT = "8082"
  # The reference witness port is reached only by machine exec on loopback, so it does not listen on the private network.
  WITNESS_BIND = "127.0.0.1"
  REKOR_URL = "https://log2025-1.rekor.sigstore.dev"
  # REKOR_LOG_KEY is public and lives here too; set it with `fly secrets set` or paste it, it is the log's public key from Sigstore's trust root.
  MONITOR_STREAM = "purse"
  MONITOR_PORT = "8083"
  DEADLATCH_URL = "https://www.deadlatch.dev"

# Agent port is public, on the app process only. The admin, witness and monitor ports are not exposed; reach them with `flyctl machine exec`.
[[services]]
  processes = ["app"]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.http_checks]]
    interval = "15s"
    timeout = "3s"
    path = "/healthz"

# Secrets, set once: fly secrets set DATABASE_URL=... PURSE_ADMIN_TOKEN=... WITNESS_KEY_PEM="$(node dist/witness.js keygen)" REKOR_LOG_KEY=... DEADLATCH_PROJECT_KEY=... OTEL_EXPORTER_OTLP_ENDPOINT=... OTEL_EXPORTER_OTLP_HEADERS=...
# Fly secrets are app-wide, so every machine receives WITNESS_KEY_PEM and DEADLATCH_PROJECT_KEY even though only one process reads each; run a process as its own Fly app with the same image and command to keep a secret off the others.
# Without DEADLATCH_PROJECT_KEY the monitor still runs and writes flags to its own machine and to the monitor_flags table. Set the key when the project exists and Fly restarts the machines.
